services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ratelock
      POSTGRES_USER: ratelock
      POSTGRES_PASSWORD: ratelock123
    ports:
      - "54321:5432"
    container_name: ratelock-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelock -d ratelock"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./schemas/raw_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    container_name: ratelock-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: